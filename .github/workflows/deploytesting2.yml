name: Fastshop CI GitOps

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ankhang24112411-sudo/fastshop
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:



      - name: Checkout source code
        uses: actions/checkout@v6


 

      - name: Setup Java 17
        uses: actions/setup-java@v5

        with:
          distribution: temurin
          java-version: "17"
          cache: maven




      - name: Run Maven tests
        working-directory: FASTSHOP/net

        run: |
          mvn -B -Dtest='!NetApplicationTests' test



      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3



      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build and push Fastshop image
        uses: docker/build-push-action@v6

        with:
          context: ./FASTSHOP/net
          file: ./FASTSHOP/net/Dockerfile

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}




      - name: Checkout GitOps repository
        uses: actions/checkout@v6

        with:
          repository: ankhang24112411-sudo/deploy-testing2-gitops

          token: ${{ secrets.GITOPS_TOKEN }}

          path: gitops



      - name: Update Kubernetes image tag
        shell: bash

        run: |
          IMAGE="${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Deploy image:"
          echo "${IMAGE}"

          sed -i -E \
            "s#image: ghcr.io/ankhang24112411-sudo/fastshop:.*#image: ${IMAGE}#" \
            gitops/k8s/deployment.yaml

          echo "Updated deployment:"
          grep "image:" gitops/k8s/deployment.yaml


      # 9. Commit GitOps repo

      - name: Commit and push GitOps change
        working-directory: gitops

        shell: bash

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No GitOps change"
            exit 0
          fi

          git commit -m "Deploy Fastshop ${GITHUB_SHA}"
          git push origin main
