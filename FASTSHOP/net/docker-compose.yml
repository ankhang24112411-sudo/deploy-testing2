services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT:-1433}:1433"

    volumes:
      - mssql-data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - fastshop-network

  web:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      SERVER_PORT: ${APP_PORT:-8000}
      SPRING_DATASOURCE_URL: jdbc:sqlserver://db:1433;databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true;sslProtocol=TLSv1.2;
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-update}

    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - fastshop-network

networks:
  fastshop-network:
    driver: bridge

volumes:
  mssql-data:
