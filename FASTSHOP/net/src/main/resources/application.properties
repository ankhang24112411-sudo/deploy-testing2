# Server
server.port=${SERVER_PORT:8000}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://${DB_HOST:db}:1433;databaseName=${DB_NAME:Fastshop};encrypt=true;trustServerCertificate=true;sslProtocol=TLSv1.2;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:${JPA_DDL_AUTO:update}}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:${JPA_SHOW_SQL:false}}
spring.main.allow-circular-references=true

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
